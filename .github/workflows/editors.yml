name: Editor Extensions

# Builds the editor extensions under editors/: the VS Code extension packages into a .vsix with
# its committed schema, the Chrome extension's scripts and manifest parse, and the JetBrains
# plugin builds against its gradle.lockfile with the Gradle version the lock was written with.
on:
  push:
    branches: [dev, main]
    paths: ["editors/**", ".github/workflows/editors.yml"]
  pull_request:
    branches: [dev, main]
    paths: ["editors/**", ".github/workflows/editors.yml"]

permissions:
  contents: read

jobs:
  vscode:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # about 3x the slowest recent run, at least 15
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install vsce package --out loaddensity.vsix
      - name: The package carries the schema
        run: npx --no-install vsce ls | grep -Fx "schemas/loaddensity-action-schema.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: loaddensity-vscode
          path: editors/vscode/loaddensity.vsix

  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # about 3x the slowest recent run, at least 15
    defaults:
      run:
        working-directory: editors/chrome-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - name: Scripts parse
        run: |
          for script in *.js; do
            node --check "$script"
          done
      - name: Manifest parses and every file it names exists
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const files = [m.background && m.background.service_worker, m.action && m.action.default_popup].filter(Boolean);
            const missing = files.filter((f) => !fs.existsSync(f));
            if (m.manifest_version !== 3 || missing.length) {
              console.error("manifest_version", m.manifest_version, "missing", missing);
              process.exit(1);
            }
          '

  jetbrains:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # about 3x the slowest recent run, at least 15
    defaults:
      run:
        working-directory: editors/jetbrains
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          gradle-version: "8.10.2"
      - run: gradle buildPlugin --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: loaddensity-jetbrains
          path: editors/jetbrains/build/distributions/*.zip
