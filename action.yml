name: "LoadDensity Action"
description: "Run a LoadDensity action JSON and surface failures as GitHub annotations."
author: "JE-Chen"
branding:
  icon: "activity"
  color: "purple"

inputs:
  python-version:
    description: "Python version to install"
    required: false
    default: "3.11"
  action-file:
    description: "Path to the LoadDensity action JSON to execute"
    required: true
  extras:
    description: "Optional extras to install (e.g. 'metrics,websocket')"
    required: false
    default: ""
  fail-on-error:
    description: "Fail the job when LoadDensity emits any failure record"
    required: false
    default: "true"
  pip-install-extra:
    description: "Extra pip install args (e.g. matplotlib)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install LoadDensity
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ -n "${{ inputs.extras }}" ]; then
          pip install "je_load_density[${{ inputs.extras }}]"
        else
          pip install je_load_density
        fi
        if [ -n "${{ inputs.pip-install-extra }}" ]; then
          pip install ${{ inputs.pip-install-extra }}
        fi

    - name: Lint action JSON
      shell: bash
      run: |
        python -c "from je_load_density import lint_action_file; import json, sys; \
          findings = lint_action_file('${{ inputs.action-file }}'); \
          [print('::%s file=${{ inputs.action-file }}::%s' % (f['severity'], f['message'])) for f in findings]; \
          sys.exit(1 if any(f['severity']=='error' for f in findings) else 0)"

    - name: Run LoadDensity
      shell: bash
      run: python -m je_load_density run "${{ inputs.action-file }}"

    - name: Emit GitHub annotations
      shell: bash
      run: |
        python -c "from je_load_density import emit_github_annotations, test_record_instance; \
          count = emit_github_annotations(title='LoadDensity'); \
          import sys; sys.exit(1 if (count > 0 and '${{ inputs.fail-on-error }}'=='true') else 0)"
