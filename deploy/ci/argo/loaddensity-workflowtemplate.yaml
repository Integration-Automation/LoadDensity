apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: loaddensity-run
spec:
  entrypoint: run
  arguments:
    parameters:
      - name: action-file
        value: actions/smoke.json
      - name: extras
        value: metrics,websocket
      - name: image
        value: ghcr.io/integration-automation/loaddensity:latest
  templates:
    - name: run
      inputs:
        parameters:
          - name: action-file
          - name: extras
          - name: image
      container:
        image: "{{inputs.parameters.image}}"
        # Parameters reach the script as environment variables, not as text pasted into it, so a
        # value containing quotes or ";" stays a value instead of becoming part of the command.
        env:
          - name: LD_EXTRAS
            value: "{{inputs.parameters.extras}}"
          - name: LD_ACTION_FILE
            value: "{{inputs.parameters.action-file}}"
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            if [ -n "$LD_EXTRAS" ]; then
              pip install --quiet "je_load_density[$LD_EXTRAS]"
            fi
            loaddensity run "$LD_ACTION_FILE"
