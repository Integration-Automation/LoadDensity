apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: loaddensity-run
spec:
  entrypoint: run
  arguments:
    parameters:
      - name: action-file
        value: actions/smoke.json
      - name: extras
        value: metrics,websocket
      - name: image
        value: ghcr.io/integration-automation/loaddensity:latest
  templates:
    - name: run
      inputs:
        parameters:
          - name: action-file
          - name: extras
          - name: image
      container:
        image: "{{inputs.parameters.image}}"
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eux
            if [ -n "{{inputs.parameters.extras}}" ]; then
              pip install --quiet "je_load_density[{{inputs.parameters.extras}}]"
            fi
            loaddensity run "{{inputs.parameters.action-file}}"
