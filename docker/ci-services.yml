services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-t", "health", "-m", "ready"]
      interval: 2s
      timeout: 2s
      retries: 15
  probe:
    image: loaddensity-services:ci
    build:
      context: ..
      dockerfile: docker/services.Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
