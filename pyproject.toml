# Rename to stable version
# This is stable version
[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "je_load_density"
version = "0.0.74"
authors = [
    { name = "JE-Chen", email = "jechenmailman@gmail.com" },
]
description = "Load & Stress Automation Freamework"
requires-python = ">=3.10"
license-files = ["LICENSE"]
dependencies = [
    "locust",
    "defusedxml>=0.7.1",
    "tomli>=2.0; python_version < '3.11'",
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: X11 Applications",
    "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://github.com/Integration-Automation/LoadDensity"
Documentation = "https://loaddensity.readthedocs.io/en/latest/"
Code = "https://github.com/Integration-Automation/LoadDensity"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools.packages]
find = { namespaces = false }

[project.optional-dependencies]
gui = ["PySide6==6.11.2", "qt-material"]
websocket = ["websocket-client>=1.6"]
grpc = ["grpcio>=1.60", "protobuf>=4.25"]
mqtt = ["paho-mqtt>=2.0"]
redis = ["redis>=5.0"]
kafka = ["kafka-python>=2.3.2"]
sql = ["sqlalchemy>=2.0"]
mongo = ["pymongo>=4.6"]
http2 = ["httpx[http2]>=0.27"]
prometheus = ["prometheus-client>=0.19"]
opentelemetry = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
]
metrics = [
    "prometheus-client>=0.19",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
]
charts = ["matplotlib>=3.8"]
yaml = ["pyyaml>=6.0"]
auth = ["cryptography>=50.0.0"]
reliability = ["psutil>=5.9"]
faker = ["faker>=24.0"]
# The MCP server speaks the protocol itself; the extra stays so "je_load_density[mcp]" still installs.
mcp = []
http3 = ["aioquic>=0.9"]
amqp = ["pika>=1.3"]
nats = ["nats-py>=2.6"]
pulsar = ["pulsar-client>=3.4"]
cassandra = ["cassandra-driver>=3.29"]
elasticsearch = ["elasticsearch>=8.10"]
coap = ["aiocoap>=0.4"]
sftp = ["paramiko>=3.4"]
datadog = ["ddtrace>=2.5"]
pdf = ["reportlab>=4.0"]
k8s = ["kopf>=1.37", "kubernetes>=29"]
ldap = ["ldap3>=2.9"]
snmp = ["pysnmp>=4.4"]
modbus = ["pymodbus>=3.5"]
opcua = ["asyncua>=1.0"]
zmq = ["pyzmq>=25.1"]
thrift = ["thriftpy2>=0.4"]
memcached = ["pymemcache>=4.0"]
neo4j = ["neo4j>=5.15"]
couchbase = ["couchbase>=4.1"]
etcd = ["etcd3>=0.12"]
webpush = ["pywebpush>=1.14"]
aws = ["boto3>=1.34"]
gcp = ["google-auth>=2.27"]
azure = ["azure-identity>=1.15", "azure-mgmt-containerinstance>=10.1"]
cloud = [
    "boto3>=1.34",
    "google-auth>=2.27",
    "azure-identity>=1.15",
    "azure-mgmt-containerinstance>=10.1",
]
all = [
    "PySide6==6.11.2", "qt-material",
    "websocket-client>=1.6",
    "grpcio>=1.60", "protobuf>=4.25",
    "paho-mqtt>=2.0",
    "redis>=5.0",
    "kafka-python>=2.3.2",
    "sqlalchemy>=2.0",
    "pymongo>=4.6",
    "httpx[http2]>=0.27",
    "prometheus-client>=0.19",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "cryptography>=50.0.0",
    "psutil>=5.9",
    "faker>=24.0",
    "aioquic>=0.9",
    "pika>=1.3",
    "nats-py>=2.6",
    "pulsar-client>=3.4",
    "cassandra-driver>=3.29",
    "elasticsearch>=8.10",
    "aiocoap>=0.4",
    "paramiko>=3.4",
    "ddtrace>=2.5",
    "reportlab>=4.0",
    "kopf>=1.37",
    "kubernetes>=29",
    "ldap3>=2.9",
    "pysnmp>=4.4",
    "pymodbus>=3.5",
    "asyncua>=1.0",
    "pyzmq>=25.1",
    "thriftpy2>=0.4",
    "pymemcache>=4.0",
    "neo4j>=5.15",
    "couchbase>=4.1",
    "etcd3>=0.12",
    "pywebpush>=1.14",
    "boto3>=1.34",
    "google-auth>=2.27",
    "azure-identity>=1.15",
    "azure-mgmt-containerinstance>=10.1",
]

[project.scripts]
loaddensity = "je_load_density.__main__:main"
loaddensity-mcp = "je_load_density.mcp_server.__main__:main"
loaddensity-lsp = "je_load_density.action_lsp.__main__:main"

[tool.bandit]
exclude_dirs = ["test", "tests", ".venv", "build", "dist"]

[tool.bandit.assert_used]
skips = ["**/test_*.py", "**/*_test.py", "**/conftest.py"]